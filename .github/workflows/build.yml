name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build
        run: gradle clean build --stacktrace
      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: MiraAuctionHouse-0.1.3
          path: build/libs/MiraAuctionHouse-0.1.3.jar

      - name: Publish v0.1.3 release if missing
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.1.3 >/dev/null 2>&1; then
            gh release create v0.1.3 \
              build/libs/MiraAuctionHouse-0.1.3.jar \
              --target "${{ github.sha }}" \
              --title "MiraAuctionHouse v0.1.3" \
              --notes "Adds quantity-aware completed-sale analytics, 24h/7d/30d market statistics, median/range/volume/trend data, global PlaceholderAPI market metrics and fixes runtime version metadata."
          fi
