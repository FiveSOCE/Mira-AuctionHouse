name: Release v0.1.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build
        run: gradle clean build --stacktrace
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0 \
            build/libs/MiraAuctionHouse-0.1.0.jar \
            --target "$GITHUB_SHA" \
            --title "MiraAuctionHouse v0.1.0" \
            --notes "Initial MiraAuctionHouse release. Fixed-price listings only, newest-to-oldest browsing, 48-hour expiry with claims, Vault economy support, search, categories, listing limits, purchase confirmation, player history, blacklist rules and admin removal tools."
