name: Modern Paper compatibility and release
on:
  push:
    branches: ['compat/modern-1.21.11-26.2']
  pull_request:
    branches: ['compat/modern-1.21.11-26.2']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compatibility-1-21-11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - run: gradle clean compileJava -PpaperApiVersion=1.21.11-R0.1-SNAPSHOT -PcompileJavaVersion=21 -PbytecodeJavaVersion=21 --stacktrace
  compatibility-26-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - run: gradle clean compileJava -PpaperApiVersion=26.2.build.121-stable -PcompileJavaVersion=25 -PbytecodeJavaVersion=25 --stacktrace
  build-and-release:
    needs: [compatibility-1-21-11, compatibility-26-2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - run: gradle clean test build -PpaperApiVersion=1.21.11-R0.1-SNAPSHOT -PcompileJavaVersion=21 -PbytecodeJavaVersion=21 --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MiraAuctionHouse_1.21.11-26.2
          path: build/libs/MiraAuctionHouse_1.21.11-26.2.jar
          if-no-files-found: error
      - name: Publish modern release after successful build
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.6-paper-1.21.11-26.2"
          JAR="build/libs/MiraAuctionHouse_1.21.11-26.2.jar"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" --target "${{ github.sha }}" --title "MiraAuctionHouse 1.21.11-26.2" --notes "Modern build. CI compiles against both endpoint APIs. Requires Vault and a Vault-compatible economy provider."
          fi
