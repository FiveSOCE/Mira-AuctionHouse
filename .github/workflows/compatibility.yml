name: Paper 1.18.2 compatibility and release
on:
  push:
    branches: ['compat/1.18.2']
  pull_request:
    branches: ['compat/1.18.2']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Compile, test and package Paper 1.18.2
        run: gradle clean test build -PpaperApiVersion=1.18.2-R0.1-SNAPSHOT -PcompileJavaVersion=17 -PbytecodeJavaVersion=17 --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MiraAuctionHouse_1.18.2
          path: build/libs/MiraAuctionHouse_1.18.2.jar
          if-no-files-found: error
      - name: Publish legacy release after successful build
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.6-paper-1.18.2"
          JAR="build/libs/MiraAuctionHouse_1.18.2.jar"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" --target "${{ github.sha }}" --title "MiraAuctionHouse 1.18.2" --notes "Legacy Paper 1.18.2 / Java 17 build. Requires Vault and a Vault-compatible economy provider."
          fi
